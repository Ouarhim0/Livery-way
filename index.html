<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجميع الطرق - مراكش</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f0f2f5;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}
.header{
  background:#00b894;
  color:white;
  padding:15px;
  text-align:center;
  width:100%;
  box-sizing:border-box;
}
.container{
  width:95%;
  max-width:800px;
  margin:15px auto;
  background:white;
  border-radius:15px;
  padding:15px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  box-sizing:border-box;
}
.stats{
  display:flex;
  justify-content:space-around;
  background:#f8f9fa;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
}
.stat{text-align:center}
.stat b{font-size:18px;color:#00b894;display:block}
.stat span{font-size:12px;color:#666}
/* هنا الخريطة فالوسط */
#map{
  height:400px;
  width:100%;
  border-radius:12px;
  border:2px solid #e0e0e0;
}
.buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}
button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}
.btn-green{background:#00b894;color:white}
.btn-blue{background:#0984e3;color:white}
</style>
</head>
<body>

<div class="header">
<h2 style="margin:0">🚚 نظام تجميع الطرق - مراكش</h2>
<p style="margin:5px 0 0;font-size:13px">وفر 58% من المازوط والوقت</p>
</div>

<div class="container">
  <div class="stats">
    <div class="stat"><b id="before">12 km</b><span>قبل</span></div>
    <div class="stat"><b id="after">5.1 km</b><span>بعد التجميع</span></div>
    <div class="stat"><b id="saved" style="color:#e17055">6.9 km</b><span>وفرتي</span></div>
  </div>

  <!-- الخريطة هنا فالوسط -->
  <div id="map"></div>

  <div class="buttons">
    <button class="btn-green" onclick="جمع_الطلبيات()">🔄 جمع الطلبيات</button>
    <button class="btn-blue" onclick="ارسل_لليفور()">📲 واتساب للليفور</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
