<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجميع الطرق - مراكش فابور</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5}
#map{height:70vh;width:100%}
.header{background:#00b894;color:white;padding:15px;text-align:center}
.stats{display:flex;justify-content:space-around;background:white;padding:10px;margin:10px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.stat{text-align:center}.stat b{font-size:20px;color:#00b894}
button{width:90%;margin:10px 5%;padding:15px;background:#00b894;color:white;border:none;border-radius:10px;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0">🚚 نظام تجميع الطرق - مراكش</h2>
<p style="margin:5px 0 0">وفر 58% من المازوط والوقت</p>
</div>
<div class="stats">
<div class="stat"><b id="before">12 km</b><br>قبل</div>
<div class="stat"><b id="after">5.1 km</b><br>بعد التجميع</div>
<div class="stat"><b id="saved" style="color:#e17055">6.9 km</b><br>وفرتي</div>
</div>
<div id="map"></div>
<button onclick="جمع_الطلبيات()">🔄 جمع الطلبيات الآن</button>
<button onclick="ارسل_لليفور()" style="background:#0984e3">📲 إرسال الطريق لليفور على واتساب</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
